# ScholarChain EMR hourly rates for the G6 cost estimate (Subphase 13B). Format: KEY=VALUE, one per line,
# read (never executed) by scripts/lib/common.sh sc_load_pricing. Every key here is PINNED: a same-named
# environment variable is ignored. Tests use SCHOLARCHAIN_PRICING_FILE together with the announced test-only
# SCHOLARCHAIN_CONFIG_FILE.
#
# Rates are the public on-demand list prices (USD per instance-hour) read from AWS's public Price List
# bulk files, anonymously, on the retrieval date below. No credential was used. They do NOT include EBS,
# EFS, S3, NAT or data transfer; the estimate is (instances x (EC2 + EMR rate)) x maximum runtime, as decided.

# Region the rates apply to (the Phase 12 region).
EMR_PRICING_REGION=us-east-2

# Date the rates were retrieved (UTC).
EMR_PRICING_RETRIEVED=2026-11-06

# Source URLs (public, read-only, no credentials). EC2 list published 2026-11-05T16:26:28Z, filtered to
# Linux, Shared tenancy, No pre-installed software, no license, on-demand, capacity status Used. EMR list
# published 2026-11-04T23:48:04Z, product softwareType EMR (the EMR uplift per instance-hour).
EMR_PRICING_SOURCES=https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonEC2/current/us-east-2/index.csv https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/ElasticMapReduce/current/us-east-2/index.json

# Human confirmation of the rates above. run-bounded-pipeline.sh --execute and run-experiment.sh --execute refuse
# until the human changes this to true after checking the sources. An agent never sets it.
EMR_PRICING_CONFIRMED_BY_HUMAN=true

# m5.xlarge (the instance type of the Phase 12D spike and the default of modules/emr).
EMR_RATE_EC2_M5_XLARGE=0.192
EMR_RATE_EMR_M5_XLARGE=0.048

# m5.2xlarge (the other type the Terraform variable allows).
EMR_RATE_EC2_M5_2XLARGE=0.384
EMR_RATE_EMR_M5_2XLARGE=0.096
