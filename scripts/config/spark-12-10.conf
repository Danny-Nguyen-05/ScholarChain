# Spark properties required by decision 12-10 (EMR emr-7.8.0 with applications ["Hadoop"] only and the portable
# Spark 3.5.4 / Scala 2.13.14 runtime on Java 17). One "key value" pair per line; run-bounded-pipeline.sh passes
# each pair as `spark-submit --conf key=value`. Blank lines and lines starting with # are ignored. The file's
# sha256 is part of the approved run configuration. Rationale and live evidence:
# docs/agent-runs/phase-12/evidence/12d-spike-closeout/decision-12-10.md and the spike's main.tf.
#
# Classpath: the custom runtime only, never the stock EMR Spark or Hadoop classpath.
spark.yarn.jars local:/opt/scholarchain-runtime/jars/*
spark.yarn.populateHadoopClasspath false
# G1 option (ii): no S3 filesystem in the runtime, so the default file system is the local/EFS path.
spark.hadoop.fs.defaultFS file:///
# EMR's node configuration lists the LZO codecs, which the runtime does not ship (live attempt 4): override with
# the four codecs that are in hadoop-client-api-3.3.4.jar.
spark.hadoop.io.compression.codecs org.apache.hadoop.io.compress.GzipCodec,org.apache.hadoop.io.compress.DefaultCodec,org.apache.hadoop.io.compress.BZip2Codec,org.apache.hadoop.io.compress.SnappyCodec
# Security: Spark authentication, AES-CTR network encryption (authEngineVersion=1; AES-GCM is not used) and IO
# encryption. spark.authenticate.secret is deliberately not set: YARN generates a per-application secret.
spark.authenticate true
spark.network.crypto.enabled true
spark.network.crypto.authEngineVersion 1
spark.network.crypto.saslFallback false
spark.io.encryption.enabled true
# G2: a Hadoop-only cluster has no Spark shuffle service, so dynamic allocation tracks shuffle files instead.
# First proven live in Phase 15 (experiments A and B).
spark.dynamicAllocation.enabled true
spark.dynamicAllocation.shuffleTracking.enabled true
spark.shuffle.service.enabled false
spark.dynamicAllocation.minExecutors 1
# Executor and driver sizing proven on m5.xlarge in the spike (1 core, 3g each).
spark.executor.cores 1
spark.executor.memory 3g
spark.driver.cores 1
spark.driver.memory 3g
# Bounded, predictable failure behaviour (as in the proven spike).
spark.task.maxFailures 1
spark.yarn.maxAppAttempts 1
spark.ui.enabled false
# Class-origin evidence in the driver and executor stdout.
spark.driver.extraJavaOptions -Xlog:class+load=info
spark.executor.extraJavaOptions -Xlog:class+load=info
