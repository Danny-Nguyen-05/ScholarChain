# ScholarChain Phase 13 automation settings (non-secret). Format: KEY=VALUE, one per line.
# Read by scripts/lib/common.sh (sc_load_config), which does NOT execute this file: only lines
# matching ^[A-Z][A-Z0-9_]*=  are accepted, and the value is the rest of the line verbatim
# (no quotes, no expansion). Pinned keys (listed in SC_PINNED_KEYS in scripts/lib/common.sh:
# REQUIRED_TERRAFORM_VERSION, RUNTIME_ARCHIVE_EXPECTED_*, IMAGE_PLATFORM, ECS_ARCH_SOURCE,
# APPROVAL_RECORD_PATH, SERVICE_ARTIFACTS, PLAN_DIR, PRESPEND_*, TERRAFORM_STATE_FILE, CLEANUP_*_RULES,
# CLEANUP_PROTECTION_RULES, CLEANUP_PREPARE_ALLOWED_ATTRS, RUNTIME_LIVE_*) ignore the
# environment (announced as CONFIG-IGNORED). Any other key may be overridden by a same-named
# environment variable (announced as CONFIG-OVERRIDE). Each setting has a one-line rationale above it.
# No bucket name, account ID, region or endpoint belongs here: those come from the environment
# or arguments (course.tfvars intentionally omits them).

# Image platform the services are built for; must equal the ECS task cpu_architecture (checked).
IMAGE_PLATFORM=linux/amd64

# Service artifacts as name=main-class pairs; must match the Dockerfile MAIN_CLASS allowlist (checked).
SERVICE_ARTIFACTS=query-api=edu.uic.cs441.scholarchain.services.QueryApiMain graph-service=edu.uic.cs441.scholarchain.services.GraphServiceMain semantic-service=edu.uic.cs441.scholarchain.services.SemanticServiceMain embedding-worker=edu.uic.cs441.scholarchain.services.EmbeddingWorkerMain

# Local image name prefix; the full name is <prefix>-<service>:<tag>.
LOCAL_IMAGE_PREFIX=scholarchain

# Where the ECS task architecture is declared; package.sh and deploy.sh parse cpu_architecture here.
ECS_ARCH_SOURCE=infra/terraform/modules/runtime/compute.tf

# Dockerfile used for every service image (MAIN_CLASS selects the service).
DOCKERFILE=Dockerfile

# Terraform CLI version the repository is pinned to (versions.tf required_version).
REQUIRED_TERRAFORM_VERSION=1.13.5

# Terraform root module directory and environment variable files (environments/<name>.tfvars).
TERRAFORM_ROOT=infra/terraform
TERRAFORM_ENV_DIR=infra/terraform/environments

# The LIVE local Terraform state file of the course root (the root declares no backend block, so Terraform's
# local default is infra/terraform/terraform.tfstate). plan.sh, deploy.sh, rollback.sh and cleanup.sh bind
# every materialized copy of the source to THIS file and record its lineage, serial and sha256; pinned.
TERRAFORM_STATE_FILE=infra/terraform/terraform.tfstate

# ECR repository and ECS naming follow modules/runtime: repo <project>-<environment>/<service>,
# cluster <project>-<environment>. Defaults match course.tfvars; override with the same-named env var.
NAME_PREFIX_PROJECT=scholarchain
NAME_PREFIX_ENVIRONMENT=course

# Human approval record read by deploy.sh (decision 13-2). --approval changes the file that is READ;
# this literal path is also the ONE path exempt from the dirty-tree refusal (exact string comparison
# on the parsed `git status` output): --approval never adds an exemption.
APPROVAL_RECORD_PATH=docs/agent-runs/phase-14/human-gate.md

# Default location of the human-written pre-spend receipt (plan Section 7.3a; override with
# --prespend). It lives under the git-ignored target/ so it never makes the work tree dirty.
PRESPEND_RECEIPT_DEFAULT_PATH=target/phase14/prespend-receipt.json

# Pre-spend gate pins (decision F5): the cost snapshot may be at most this many hours old, and the
# remaining headroom must be at least this many USD, before any push, apply or upload.
PRESPEND_MAX_AGE_HOURS=24
PRESPEND_MIN_HEADROOM_USD=20

# Release artifact locations produced by `sbt -batch packageRelease` (globs, version-independent;
# newest match wins). The service distribution directory is what the Dockerfile COPYs.
ARTIFACT_HADOOP_SUBMIT_GLOB=modules/hadoop/target/scala-*/hadoop-submit_3-*.jar
ARTIFACT_HADOOP_BUNDLE_GLOB=modules/hadoop/target/scala-*/hadoop-dependency-bundle_3-*.jar
ARTIFACT_SPARK_JOB_GLOB=modules/spark/target/spark-job_3-*.jar
ARTIFACT_SERVICE_DIST_DIR=modules/services/target/distribution

# Generated release/plan/cleanup output roots. All live under the git-ignored target/. PLAN_DIR is the
# ONLY place plan binaries, raw show JSON, full plan text, receipts and plan logs may be written
# (every derived path is also verified with `git check-ignore`); it is pinned.
RELEASE_DIR=target/release
PLAN_DIR=target/plans
CLEANUP_EVIDENCE_DIR=target/cleanup-evidence
CHECK_LOG_DIR=target/check-logs

# G5 runtime archive (decision 12-10): expected size and sha256, default ignored local path.
RUNTIME_ARCHIVE_DEFAULT_PATH=target/phase12d-runtime-repair-20261103/artifacts/scholarchain-spark3.5.4-scala2.13.14-java17-runtime.tgz
RUNTIME_ARCHIVE_EXPECTED_SHA256=789a9684f91527dfd9b97d56acce9dbfe5dd4c328299542245da92968f916de5
RUNTIME_ARCHIVE_EXPECTED_SIZE=321876735

# Name of the environment variable holding the S3 URI for the runtime archive upload (no default bucket).
RUNTIME_ARCHIVE_S3_URI_ENV=SCHOLARCHAIN_RUNTIME_ARCHIVE_S3_URI

# Name of the environment variable holding the private Terraform variable file path (never echoed).
TF_PRIVATE_VARS_ENV=SCHOLARCHAIN_TF_PRIVATE_VARS

# Logback file that keeps the sbt JVM quiet about XML repair noise (phase 4); must exist.
SBT_LOGBACK_FILE=docs/agent-runs/phase-04/xml-repair-logback.xml

# JDK 17 fallback locations, tried in order after JAVA_HOME and /usr/libexec/java_home -v 17.
JDK17_FALLBACK_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

# The required script test suites are pinned INSIDE scripts/check.sh (REQUIRED_SUITES), not here: they
# cannot be replaced from the environment or this file in a default run; an omitted suite fails the
# gate and a suite that executes zero tests fails the gate.

# JSON files under these path prefixes are deliberate test fixtures and are not parse-checked.
JSON_FIXTURE_EXCLUDES=scripts/tests/fixtures/

# Timeouts in seconds (every external command goes through scripts/lib/timeout.py).
TIMEOUT_GRACE_SECONDS=10
TIMEOUT_QUICK_SECONDS=120
TIMEOUT_SBT_CHECK_SECONDS=3600
TIMEOUT_SBT_PACKAGE_SECONDS=2400
TIMEOUT_DOCKER_BUILD_SECONDS=1500
TIMEOUT_TERRAFORM_LOCAL_SECONDS=900
TIMEOUT_TERRAFORM_PLAN_SECONDS=1800
TIMEOUT_TERRAFORM_APPLY_SECONDS=3600
TIMEOUT_AWS_SECONDS=120
TIMEOUT_DOCKER_PUSH_SECONDS=1800
TIMEOUT_S3_UPLOAD_SECONDS=3600
TIMEOUT_SHELLCHECK_SECONDS=300

# Resource type prefixes reported as stateful or IAM in plan receipts (comma separated).
STATEFUL_TYPE_PREFIXES=aws_s3_bucket,aws_s3vectors_,aws_dynamodb_,aws_neptune_,aws_kms_,aws_efs_,aws_secretsmanager_,aws_cloudwatch_log_group
IAM_TYPE_PREFIXES=aws_iam_

# Tag keys that mark project resources (modules/foundation required tags: project, environment).
# cleanup.sh inventories resources whose tags equal NAME_PREFIX_PROJECT / NAME_PREFIX_ENVIRONMENT.
CLEANUP_TAG_KEY_PROJECT=project
CLEANUP_TAG_KEY_ENVIRONMENT=environment

# Terraform roots cleanup.sh destroys (the main environment only). Account-level roots (deployer,
# billing-*) and spikes are inventoried but preserved: they are listed in CLEANUP_PRESERVE.
CLEANUP_DESTROY_ROOTS=infra/terraform

# Cleanup preserve summary (printed by cleanup.sh). Policy (user decision, repair round 1): never
# remove the Terraform state/backend, any S3 bucket or object, S3 Vectors, the KMS keys, aliases and
# key policies that keep preserved data readable, or the CloudWatch log groups needed for grading.
# S3 prevent_destroy stays in force.
CLEANUP_PRESERVE=terraform-state,s3-buckets-and-objects,s3-vectors,kms-keys-and-policies,grading-log-groups

# Classification rules (pinned; space or comma separated). A rule matches a Terraform address with any
# [index] removed: an entry ending in "." is an address prefix, any other entry matches that exact
# resource address. PRESERVE wins over TEARDOWN; an address matching neither is UNLISTED and makes
# the saved plan refuse.
# PRESERVE by resource type prefix (bucket policies, versioning and lifecycle belong to the bucket
# family): S3 buckets and objects, S3 Vectors, KMS keys/aliases/key policies, CloudWatch log groups.
CLEANUP_PRESERVE_TYPE_RULES=aws_s3_bucket,aws_s3_object,aws_s3vectors_,aws_kms_,aws_cloudwatch_log_group

# PRESERVE by address: module.foundation holds the state bucket, lock table and budget;
# module.datalake and module.s3vectors hold the datalake/evidence/artifacts buckets and the vector store.
CLEANUP_PRESERVE_ADDRESS_RULES=module.foundation.,module.datalake.,module.s3vectors.

# Deletion protections that block a teardown (R5), as type:attribute=active-value pairs. cleanup.sh refuses the
# destructive sequence (PREPARE-REQUIRED) while a teardown resource in the current state still has one active.
# The values come from modules/neptune, modules/runtime (ALB, ECR) and modules/dynamodb under cleanup_mode=false.
CLEANUP_PROTECTION_RULES=aws_neptune_cluster:deletion_protection=true,aws_lb:enable_deletion_protection=true,aws_dynamodb_table:deletion_protection_enabled=true,aws_ecr_repository:force_delete=false

# The ONLY attributes a cleanup-preparation plan (plan with -var=cleanup_mode=true) may change, per resource type
# (in-place updates of teardown resources only): the protection and force flags that cleanup_mode toggles, plus
# the Neptune final-snapshot settings that cleanup_mode also switches. Anything else refuses the plan.
CLEANUP_PREPARE_ALLOWED_ATTRS=aws_neptune_cluster:deletion_protection+skip_final_snapshot+final_snapshot_identifier,aws_lb:enable_deletion_protection,aws_dynamodb_table:deletion_protection_enabled,aws_ecr_repository:force_delete

# TEARDOWN classes: ECS/ECR runtime, EMR, Neptune, DynamoDB, SQS, Step Functions and the network
# (NAT/EIP, endpoints, VPC and children). The identity and observability entries are the runtime IAM
# roles and policies and the alarms and dashboard that Terraform pulls into a targeted run as
# dependents of those classes; the deployment role, KMS and log groups are deliberately NOT listed.
CLEANUP_TEARDOWN_ADDRESS_RULES=module.runtime.,module.emr.,module.neptune.,module.dynamodb.,module.messaging.,module.workflow.,module.network.,module.identity.aws_iam_role.task,module.identity.aws_iam_role.execution,module.identity.aws_iam_role.emr_ec2,module.identity.aws_iam_role.emr_service,module.identity.aws_iam_role.neptune_loader,module.identity.aws_iam_role_policy.,module.identity.aws_iam_instance_profile.emr,module.observability.aws_cloudwatch_metric_alarm.,module.observability.aws_cloudwatch_dashboard.

# S1/T1 runtime-live detection (repair rounds 3 and 4), pinned. Module whose resources are the deployed runtime.
RUNTIME_LIVE_MODULE=module.runtime

# T1 (repair round 4), pinned. "Runtime live" is decided ONLY from resources of RUNTIME_LIVE_MODULE that exist solely while
# the runtime is deployed (count/for_each gated on enabled && image_revision != null in modules/runtime/compute.tf):
# aws_ecs_service.service (for_each local.active_services, four services), aws_lb.query and aws_lb_target_group.query
# (count) and aws_lb_listener.https (count; it also needs certificate_arn, so a complete runtime has 0 or 1 of it).
# scripts/tests/test_runtime_base_apply.py re-derives this classification from the Terraform source.
# Each entry is type=N or type=LOW-HIGH: the instance count of a COMPLETE deployed runtime. No instance of any listed type
# means "not live"; every count in range means "live"; anything else is an ambiguous PARTIAL runtime and is refused
# (fail closed). NOT indicators: the ECS cluster, the service-discovery namespace and the four ECR repositories, which have
# no count and already exist after a runtime-disabled base apply; and the other gated dependents (task definitions,
# service-discovery services, autoscaling targets and policies), which come and go with the services.
RUNTIME_LIVE_INDICATOR_TYPES=aws_ecs_service=4,aws_lb=1,aws_lb_target_group=1,aws_lb_listener=0-1

# S1 safety net, pinned: while the state shows the LIVE runtime, a plan (checked in the plan receipt and again in the
# verified plan's own `terraform show -json`) may not DELETE or REPLACE any RUNTIME_LIVE_MODULE resource of these types:
# every indicator type above plus the ECS cluster (kept while the runtime runs on it). Every indicator type must be listed
# here (verify.py refuses an inconsistent pair). Task definitions are not listed: a new revision legitimately replaces them.
RUNTIME_LIVE_PROTECTED_TYPES=aws_ecs_service,aws_lb,aws_lb_listener,aws_lb_target_group,aws_ecs_cluster

# ---------------------------------------------------------------------------------------------
# Subphase 13B: bounded pipeline, experiment runner, smoke test and evidence archive.
# Pinned keys below (listed in SC_PINNED_KEYS) ignore the environment, like the 13A pins.
# ---------------------------------------------------------------------------------------------

# G6 EMR budget (user decision 2026-11-05, confirmed 2026-11-06). The estimate is
# (instances x reviewed hourly rate) x maximum runtime; run-bounded-pipeline.sh refuses --execute above
# the per-run cap, when the live-run count is already used, or when the cumulative estimate would exceed the
# cumulative cap (USD 9.50 of the EMR reserve allocated to Phase 15; about USD 5 stays held back for KMS).
EMR_MAX_RUN_USD=3
EMR_MAX_LIVE_RUNS=3
EMR_CUMULATIVE_CAP_USD=9.50

# Local run ledger (one JSON line per reserved --execute run). It lives OUTSIDE the repository, under the user's HOME
# (~/.scholarchain/emr-ledger/runs.jsonl), so sbt clean, git clean and a fresh clone cannot erase it; a human creates it once
# with `scripts/run-bounded-pipeline.sh --init-ledger`, and an absent ledger refuses --execute.
EMR_LEDGER_PATH=~/.scholarchain/emr-ledger/runs.jsonl

# Reviewed hourly rates, their public source URLs, retrieval date and the human confirmation flag live in a
# separate pinned file (the rates are data, not policy). --execute refuses until the human sets
# EMR_PRICING_CONFIRMED_BY_HUMAN=true in that file.
PIPELINE_PRICING_FILE=scripts/config/emr-pricing.conf

# Default (and the only exempt) location of the Phase 15 approval record for run-bounded-pipeline.sh and
# run-experiment.sh. --approval selects the file that is read; only this literal path is exempt from the
# dirty-tree refusal, exactly like APPROVAL_RECORD_PATH for deploy.sh.
RUN_APPROVAL_RECORD_PATH=docs/agent-runs/phase-15/human-gate.md

# Spark properties required by decision 12-10 (one "key value" pair per line); the step passes each as --conf.
PIPELINE_SPARK_CONF_FILE=scripts/config/spark-12-10.conf

# Private output directory of run-bounded-pipeline.sh: one fresh directory per run id (planned manifest and
# result record, created exclusively and git-ignored). Written only with --execute.
PIPELINE_RUNS_DIR=target/pipeline-runs

# Private output directory of run-experiment.sh (the experiment run record and result, created exclusively,
# git-ignored). Written only with --execute.
EXPERIMENT_RUNS_DIR=target/experiment-runs

# Where the EFS file system is mounted on every node (G1 option ii: EFS staging plus S3 copy steps) and where
# the bootstrap installs the portable Spark 3.5.4 / Scala 2.13.14 runtime and the job JAR (decision 12-10).
PIPELINE_EFS_MOUNT=/mnt/scholarchain
PIPELINE_RUNTIME_DIR=/opt/scholarchain-runtime
PIPELINE_JOB_JAR_PATH=/opt/scholarchain-runtime/application/scholarchain-job.jar

# File the bootstrap writes with the Java 17 home it resolved at run time (decision 12-10: never hard-coded
# in a step). The steps read it on the node. 13C may rename the bootstrap directory; change it here.
PIPELINE_JAVA_HOME_FILE=/opt/scholarchain-spike/java-home

# Finding C1 (13C repair round 1). The ONE node directory where the bootstrap installs the sha256-pinned step programs
# (scripts/emr/sc-step.sh and the three Python programs); every EMR step runs the installed runner from here. It equals the
# bootstrap's default STEP_BIN and infra/terraform/emr-step-programs.json (bin_dir); tests compare all three.
PIPELINE_STEP_BIN_DIR=/opt/scholarchain-spike/bin

# EMR accepts at most 10,280 characters per string in a step's HadoopJarStepConfig.Args (AWS API reference). The plan
# builder refuses, before any cloud call, the ledger reservation and the approval, any step argument longer than this.
# Pinned (never environment-overridable) and clamped by the code to the API limit: it may be lowered, never raised.
PIPELINE_STEP_ARG_MAX_CHARS=10280

# Versions the class-origin check requires on the driver AND the executors (decision 12-10; they equal the
# versions the packaged job was built against: project/Versions.scala spark and sparkScalaReflect).
PIPELINE_EXPECTED_SPARK_VERSION=3.5.4
PIPELINE_EXPECTED_SCALA_VERSION=2.13.14

# Hard caps for one run: instances (1 primary + core + at most 2 task nodes, matching the Terraform bounds),
# wall-clock minutes (every step timeout is derived from it, and the estimate uses it), and the largest
# auto-termination idle timeout the cluster may have (the cluster must have one: forced auto-termination).
PIPELINE_MAX_CAPACITY=4
PIPELINE_MAX_RUNTIME_MINUTES=180
PIPELINE_MAX_IDLE_TIMEOUT_SECONDS=900

# Share of the maximum runtime each step may use, in percent (sum <= 100): stage-in, Hadoop prep,
# entity resolution, class-origin check, Spark job, copy-out.
PIPELINE_STEP_WEIGHTS=stage-in=5 hadoop-prep=20 entity-resolution=20 spark-class-origin=5 spark-job=40 copy-out=10

# Smallest timeout any single step may get, in seconds. The weighted shares of the shortest accepted run (10 minutes) give
# the smallest step 30 s (5 percent of 600 s), so 10 minutes is a real minimum: --max-runtime-minutes 10..PIPELINE_MAX_RUNTIME_MINUTES
# is accepted exactly as documented, and the six timeouts can never add up to more than the run's cap.
PIPELINE_MIN_STEP_SECONDS=30

# Data ceilings: bytes staged from S3 to EFS and bytes copied from EFS back to S3 (the Phase 12D collect step
# used 64 MiB). Phase 15 raises them only through a reviewed change of this pinned file (gap G4).
PIPELINE_MAX_INPUT_BYTES=268435456
PIPELINE_MAX_COPYOUT_BYTES=268435456

# Inclusive HadoopPrepMain ceilings, identical to the Phase 4 smoke script (scripts/phase4-emr-smoke.sh);
# a test compares these values with that script so they cannot drift apart.
PIPELINE_CEILING_MAX_LOCAL_SAMPLE_RECORDS=1000
PIPELINE_CEILING_REDUCER_COUNT=8
PIPELINE_CEILING_MAX_CANDIDATE_BLOCK_SIZE=256
PIPELINE_CEILING_MAX_CANDIDATE_PAIRS_PER_BLOCK=4096
PIPELINE_CEILING_MAX_AUTHOR_TEAM_SIZE=64
PIPELINE_CEILING_MAX_RECORD_BYTES=8388608
PIPELINE_CEILING_MAX_XML_ENTITY_EXPANSION=8388608

# Executors the Spark step may request per core or task node (executor 1 core and 3g, as in the proven spike on
# m5.xlarge); spark.dynamicAllocation.maxExecutors is (core + task nodes) x this value.
PIPELINE_MAX_EXECUTORS_PER_NODE=2

# JVM heap of the single-JVM entity-resolution step on the primary node (m5.xlarge has 16 GiB).
PIPELINE_ER_XMX=3g

# Seconds between EMR step-state polls and the YARN kill grace (non-pinned: tests set the poll to 0).
PIPELINE_POLL_SECONDS=30
PIPELINE_KILL_AFTER_SECONDS=60

# Largest file archive-evidence.sh copies (bytes). A larger file is indexed with its sha256, size and a
# required external location (Drive or S3) instead of being copied.
ARCHIVE_MAX_COPY_BYTES=1048576

# Smoke test: seconds allowed for one HTTP request and for one asynchronous job to finish (non-pinned).
TIMEOUT_SMOKE_REQUEST_SECONDS=10
TIMEOUT_SMOKE_JOB_SECONDS=60
