openapi: 3.0.3
info:
  title: ScholarChain API
  version: 1.0.0
  description: >-
    Versioned service contract. All committed examples are declared synthetic fixtures.
    Public graph routes are exposed through query-api as an authenticated thin proxy.
    Internal graph and semantic routes require the separate internal bearer token.
    Explicit offline-synthetic mode runs bounded fixture ports; unconfigured mode fails readiness.
security:
  - ExternalBearer: []
paths:
  /healthz:
    get:
      security: []
      summary: Process liveness independent of dependencies
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, enum: [alive]}}}
  /readyz:
    get:
      security: []
      summary: Dependency readiness without addresses or configuration
      responses:
        '200':
          description: Dependencies reachable
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, enum: [ready]}}}
        '503': {$ref: '#/components/responses/Error'}
  /metrics:
    get:
      summary: Authenticated Prometheus metrics including cumulative latency buckets
      responses:
        '200':
          description: >-
            Request/status/latency, timeouts, downstream failures, circuit state, verification and abstention
            counters; per-route status counts api_route_requests_total{route,status}; query-api semantic
            rate-limit replies api_rate_limited_total; and, where a query-embedding cache is composed
            (semantic-service, or offline-synthetic query-api without a remote semantic service),
            embedding_cache_hits_total, embedding_cache_misses_total (underlying embedding calls),
            embedding_cache_evictions_total, embedding_cache_size and embedding_cache_capacity
          content:
            text/plain:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /v1/query:
    post:
      summary: Execute a validated query or return its asynchronous job reference
      description: >-
        Required idempotency key is atomically reserved in QuerySessionStore. Canonical JSON binds
        its request body. Replays return the persisted terminal answer/error or current job reference;
        they never rerun the workflow. Default synchronous wait is 15000 ms; workflow execution
        has a separate configured deadline. All structured constraints must be enforced or rejected.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/TraceId'}
      requestBody:
        required: true
        description: >-
          At most 32 levels of JSON nesting (arrays and objects open at once, the root object
          counting as 1), checked on the raw text before parsing; a deeper body is 400
          INVALID_REQUEST
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryRequest'}
            examples:
              syntheticFixture:
                summary: Declared offline synthetic query
                externalValue: ./examples/query-request.json
      responses:
        '200':
          description: Persisted terminal answer, possibly an explicit abstention
          headers:
            X-Request-Id: {schema: {type: string}}
            X-Trace-Id: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryResponse'}
        '202':
          description: Bounded local asynchronous worker path accepted; consult job state
          headers:
            X-Request-Id: {schema: {type: string}}
            X-Trace-Id: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobReference'}
              examples:
                syntheticFixture:
                  externalValue: ./examples/job-reference.json
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/jobs/{jobId}:
    get:
      summary: Read persisted job state, public stage, timestamps and result link
      parameters:
        - {$ref: '#/components/parameters/JobId'}
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/TraceId'}
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobStatus'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/jobs/{jobId}/result:
    get:
      summary: Return the stored answer, pending job reference or terminal typed failure
      parameters:
        - {$ref: '#/components/parameters/JobId'}
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/TraceId'}
      responses:
        '200':
          description: Stored answer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryResponse'}
        '202':
          description: Still pending
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobReference'}
              examples:
                syntheticFixture:
                  externalValue: ./examples/job-reference.json
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/evidence/{evidenceId}:
    get:
      summary: Read one persisted evidence item with source provenance
      parameters:
        - {name: evidenceId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Actual supporting evidence and source pointer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Evidence'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /v1/queries/{queryId}/evidence:
    get:
      summary: List evidence IDs referenced by the persisted query audit
      parameters:
        - {$ref: '#/components/parameters/QueryId'}
      responses:
        '200':
          description: Audited evidence references
          content:
            application/json:
              schema: {type: object, required: [queryId, evidenceIds], properties: {queryId: {type: string}, evidenceIds: {type: array, items: {type: string}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /v1/explain/{queryId}:
    get:
      summary: Observable audit derivation with no hidden reasoning or secret prompts
      parameters:
        - {$ref: '#/components/parameters/QueryId'}
      responses:
        '200':
          description: Persisted plan, observable service stages, versions, evidence, scores and counters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Explain'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /v1/graph/nodes/{nodeId}:
    get:
      summary: Read a node from the immutable graph snapshot through query-api
      parameters:
        - {$ref: '#/components/parameters/GraphTimeoutMs'}
        - {$ref: '#/components/parameters/NodeId'}
      responses:
        '200':
          description: Actual graph node and snapshot ID
          content:
            application/json:
              schema: {type: object, required: [nodeId, snapshot, node], properties: {nodeId: {type: string}, snapshot: {type: string}, node: {type: object}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/graph/nodes/{nodeId}/neighbors:
    get:
      summary: Bounded directed graph expansion and snapshot-bound opaque pagination
      parameters:
        - {$ref: '#/components/parameters/NodeId'}
        - {name: direction, in: query, schema: {type: string, enum: [in, out, both], default: both}}
        - {name: depth, in: query, schema: {type: integer, minimum: 1, maximum: 3, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: edgeTypes, in: query, schema: {type: string}, description: Comma separated subset of COAUTHORED_WITH AUTHORED HAS_TOPIC AFFILIATED_WITH PUBLISHED_IN}
        - {name: window, in: query, schema: {type: string, default: all-years}}
        - {$ref: '#/components/parameters/GraphTimeoutMs'}
        - {name: cursor, in: query, schema: {type: string}, description: Signed opaque cursor bound to node filters limit timeout and immutable snapshot; a graph-operation budget expiry returns nonretryable GRAPH_DEADLINE_EXCEEDED 504 without dependency retries}
      responses:
        '200':
          description: Stable page; null cursor means no next page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphPage'}
              examples:
                syntheticFixture:
                  externalValue: ./examples/graph-page.json
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /v1/semantic/retrieve:
    post:
      summary: Public semantic retrieval through query-api with the public API key
      description: >-
        Authenticated with the same public API key as the other /v1 routes (401 otherwise). An
        in-memory token bucket per API-key hash in each query-api process is checked next, before
        validation and before any downstream call: default 50 requests/s sustained with a burst of
        100 (SCHOLARCHAIN_SEMANTIC_RATE_LIMIT_PER_SECOND, SCHOLARCHAIN_SEMANTIC_RATE_LIMIT_BURST);
        over the limit is a retryable 429 RATE_LIMITED with Retry-After. The body is then checked
        against the public limits (narrower than the internal route), re-serialized and forwarded
        to semantic-service /internal/v1/semantic/retrieve with the internal token. The reply is
        rebuilt from exactly hits[].key, hits[].distance, hits[].metadata and model. The question
        is never logged or used as a metric label. Semantic-service embeds questions through a
        bounded query-embedding cache, so a repeated question makes no new embedding call.
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/TraceId'}
      requestBody:
        required: true
        description: >-
          At most 8192 UTF-8 bytes and at most 32 levels of JSON nesting (arrays and objects open
          at once, the root object counting as 1), checked on the raw text before parsing; a
          deeper body is 400 INVALID_REQUEST. No query string is accepted
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicSemanticRequest'}
      responses:
        '200':
          description: Actual vector hits with distances and metadata, and the embedding model identity; similarity is not graph evidence
          headers:
            X-Request-Id: {schema: {type: string}}
            X-Trace-Id: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicSemanticResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /internal/v1/graph/nodes/{nodeId}:
    get:
      security: [{InternalBearer: []}]
      summary: Internal snapshot node read
      parameters:
        - {$ref: '#/components/parameters/GraphTimeoutMs'}
        - {$ref: '#/components/parameters/NodeId'}
      responses:
        '200': {description: Actual node and snapshot}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /internal/v1/graph/nodes/{nodeId}/neighbors:
    get:
      security: [{InternalBearer: []}]
      summary: Internal graph expansion with the same bounded query parameters as the public proxy
      parameters:
        - {$ref: '#/components/parameters/NodeId'}
        - {name: direction, in: query, schema: {type: string, enum: [in, out, both], default: both}}
        - {name: depth, in: query, schema: {type: integer, minimum: 1, maximum: 3, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: edgeTypes, in: query, schema: {type: string}}
        - {name: window, in: query, schema: {type: string, default: all-years}}
        - {$ref: '#/components/parameters/GraphTimeoutMs'}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Internal stable graph page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphPage'}
              examples:
                syntheticFixture:
                  externalValue: ./examples/graph-page.json
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /internal/v1/graph/metrics/{nodeId}:
    get:
      security: [{InternalBearer: []}]
      summary: Stored researcher metrics and qualifications without recomputation
      parameters:
        - {$ref: '#/components/parameters/GraphTimeoutMs'}
        - {$ref: '#/components/parameters/NodeId'}
        - {name: window, in: query, schema: {type: string, default: all-years}}
      responses:
        '200':
          description: Stored record, qualifications, metric version and source run
          content:
            application/json:
              schema: {type: object, required: [researcherId, window, record, qualifications, metricVersion, runId]}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /internal/v1/graph/paths:
    get:
      security: [{InternalBearer: []}]
      summary: Bounded shortest coauthor path in the immutable snapshot
      description: >-
        Level-by-level search over COAUTHORED_WITH edges only, stopping at the first level that
        contains `to`; at most one path is returned, chosen deterministically (sorted node and edge
        order). A `maxDepth` above the service path ceiling (default 6) is clamped, not rejected.
        An empty `paths` is a complete answer only when `truncated` is false; when the scan or node
        cap is reached first the reply is still 200 with `truncated` true, and it is never a proof
        that no path exists. A missing `from` or `to` node is 404.
      parameters:
        - {$ref: '#/components/parameters/GraphTimeoutMs'}
        - {name: from, in: query, required: true, schema: {type: string}}
        - {name: to, in: query, required: true, schema: {type: string}}
        - {name: maxDepth, in: query, schema: {type: integer, minimum: 1, default: 6}, description: Requested hop cap; values above the service path ceiling (default 6, 16 at most) are clamped to it}
        - {name: window, in: query, schema: {type: string, default: all-years}}
      responses:
        '200':
          description: Snapshot, the shortest path if one was found, and how the search ended
          content:
            application/json:
              schema:
                type: object
                required: [snapshot, paths, maxDepth, clamped, truncated, truncationReason]
                properties:
                  snapshot: {type: string}
                  paths:
                    type: array
                    maxItems: 1
                    items:
                      type: object
                      required: [nodeIds, edgeIds]
                      properties:
                        nodeIds: {type: array, items: {type: string}}
                        edgeIds: {type: array, items: {type: string}}
                  maxDepth: {type: integer, description: The hop cap actually applied}
                  clamped: {type: boolean, description: True when the requested maxDepth exceeded the path ceiling}
                  truncated: {type: boolean, description: True when a scan or node cap ended the search before the target was reached}
                  truncationReason: {type: string, nullable: true, enum: [scan-cap, node-cap, null]}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /internal/v1/graph/communities/{communityId}/members:
    get:
      security: [{InternalBearer: []}]
      summary: Stored members of one community in a window
      description: >-
        Answers from the snapshot's stored community membership. A snapshot that holds no
        communities answers 422 COMMUNITY_UNSUPPORTED.
      parameters:
        - {$ref: '#/components/parameters/GraphTimeoutMs'}
        - {$ref: '#/components/parameters/CommunityId'}
        - {name: window, in: query, schema: {type: string, default: all-years}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Stored member researcher IDs, at most limit
          content:
            application/json:
              schema:
                type: object
                required: [snapshot, communityId, window, members]
                properties:
                  snapshot: {type: string}
                  communityId: {type: string}
                  window: {type: string}
                  members: {type: array, items: {type: string}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /internal/v1/graph/communities/{communityId}/cross-edges:
    get:
      security: [{InternalBearer: []}]
      summary: Stored coauthor edges that leave one community in a window
      description: >-
        One row per stored edge; `nodeId` is the endpoint outside the community. `truncated` is
        true when the store reports more rows than were returned. A snapshot that holds no
        communities answers 422 COMMUNITY_UNSUPPORTED.
      parameters:
        - {$ref: '#/components/parameters/GraphTimeoutMs'}
        - {$ref: '#/components/parameters/CommunityId'}
        - {name: window, in: query, schema: {type: string, default: all-years}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Stored cross-community edges, at most limit
          content:
            application/json:
              schema:
                type: object
                required: [snapshot, communityId, window, items, truncated]
                properties:
                  snapshot: {type: string}
                  communityId: {type: string}
                  window: {type: string}
                  items:
                    type: array
                    items:
                      type: object
                      required: [nodeId, edgeId, edgeType, properties]
                      properties:
                        nodeId: {type: string}
                        edgeId: {type: string}
                        edgeType: {type: string}
                        properties: {type: object, additionalProperties: {type: string}}
                  truncated: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /internal/v1/semantic/retrieve:
    post:
      security: [{InternalBearer: []}]
      summary: Embed query text and retrieve bounded actual vector hits
      requestBody:
        required: true
        description: >-
          At most 32 levels of JSON nesting, checked on the raw text before parsing; a deeper body
          is 400 INVALID_REQUEST
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SemanticRequest'}
            examples:
              syntheticFixture:
                externalValue: ./examples/semantic-request.json
      responses:
        '200':
          description: Actual vector hits with distances and metadata; similarity is not graph evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SemanticResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    ExternalBearer: {type: http, scheme: bearer, description: API key whose SHA-256 hash is injected through Secrets Manager at deployment}
    InternalBearer: {type: http, scheme: bearer, description: Separate service token; external key is never accepted for internal routes}
  parameters:
    GraphTimeoutMs:
      name: timeoutMs
      in: query
      schema: {type: integer, minimum: 1, maximum: 5000, default: 5000}
      description: >-
        Graph operation work budget. Query-api always forwards the lesser of the requested/default
        graph cap and its transport timeout minus ceil(transport * configured reserve percent / 100).
        Reserve defaults to 25 percent, so equal 5000 ms caps forward 3750 ms. The deterministic
        clamp preserves cursor bindings under unchanged configuration. Invalid caller budgets
        yield 400; configurations leaving no positive work and response budgets are rejected.
    NodeId: {name: nodeId, in: path, required: true, schema: {type: string}}
    CommunityId: {name: communityId, in: path, required: true, schema: {type: string}}
    QueryId: {name: queryId, in: path, required: true, schema: {type: string}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, pattern: '^job-[0-9a-f]{64}$'}}
    RequestId: {name: X-Request-Id, in: header, schema: {type: string, pattern: '^[a-zA-Z0-9._:-]{1,128}$'}, description: Invalid or absent IDs are replaced by generated safe IDs}
    TraceId: {name: X-Trace-Id, in: header, schema: {type: string, pattern: '^[a-zA-Z0-9._:-]{1,128}$'}, description: Propagated to downstream calls and returned on every response}
  responses:
    Error:
      description: Typed safe error; includes current request trace ID and never a stack trace or provider message
      headers:
        X-Request-Id: {schema: {type: string}}
        X-Trace-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            syntheticFixture:
              externalValue: ./examples/error.json
    RateLimited:
      description: >-
        Typed safe error. RATE_LIMITED (retryable true) is the query-api per-key rate limit and
        carries Retry-After in whole seconds; THROTTLED is downstream throttling and carries none
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}, description: Present on RATE_LIMITED only}
        X-Request-Id: {schema: {type: string}}
        X-Trace-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error, message, traceId, retryable]
      properties:
        error: {type: string, description: Closed safe error code; GRAPH_DEADLINE_EXCEEDED denotes a nonretryable graph-operation execution budget, distinct from a transport timeout}
        message: {type: string}
        traceId: {type: string}
        retryable: {type: boolean}
    QueryRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: {type: string, minLength: 1, maxLength: 8192}
        constraints:
          type: object
          additionalProperties: false
          properties:
            yearFrom: {type: integer, minimum: 1, maximum: 9999}
            yearTo: {type: integer, minimum: 1, maximum: 9999}
            topics: {$ref: '#/components/schemas/Filters'}
            institutions: {$ref: '#/components/schemas/Filters'}
            venues: {$ref: '#/components/schemas/Filters'}
        analysis:
          type: object
          additionalProperties: false
          properties:
            rankingMetric: {type: string, enum: [PUBLICATION_COUNT, DISTINCT_COAUTHOR_COUNT, TOTAL_COAUTHOR_OCCURRENCES, AVERAGE_COAUTHORS_PER_PAPER, MAXIMUM_COAUTHORS_ON_ONE_PAPER, WEIGHTED_DEGREE, BRIDGE_SCORE, CORENESS]}
            includeTeamSize: {type: boolean}
            includeBridgeMetrics: {type: boolean}
            includeCommunities: {type: boolean}
            includePaths: {type: boolean}
        retrieval:
          type: object
          additionalProperties: false
          description: Configured deployment caps may be lower than these foundation defaults; excess caps yield 422
          properties:
            graphLimit: {type: integer, minimum: 1, maximum: 100}
            vectorLimit: {type: integer, minimum: 1, maximum: 50}
            maxPathDepth: {type: integer, minimum: 1, maximum: 6}
        output:
          type: object
          additionalProperties: false
          properties:
            includeEvidence: {type: boolean}
            includeScores: {type: boolean, description: Explicit true requires an injected evidence store and otherwise yields 422; scores are persisted retrieval signals}
            includeUncertainty: {type: boolean}
    Filters:
      type: array
      maxItems: 100
      items: {type: string, minLength: 1, maxLength: 512}
    QueryResponse:
      type: object
      required: [queryId, mode, answer, claims, links]
      properties:
        queryId: {type: string}
        mode: {type: string, enum: [synchronous]}
        answer: {type: object, required: [summary], properties: {summary: {type: string}}, additionalProperties: true}
        claims: {type: array, items: {type: object, additionalProperties: true}}
        links:
          type: object
          required: [explain, evidence, result]
          properties:
            explain: {type: string}
            evidence: {type: string}
            result: {type: string}
    JobReference:
      type: object
      required: [queryId, mode, jobId, status, statusUrl]
      properties:
        queryId: {type: string}
        mode: {type: string, enum: [asynchronous]}
        jobId: {type: string}
        status: {type: string, enum: [QUEUED, RUNNING]}
        statusUrl: {type: string}
    JobStatus:
      type: object
      required: [jobId, queryId, state, stage, createdAt, updatedAt, resultUrl, error]
      properties:
        jobId: {type: string}
        queryId: {type: string}
        state: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
        stage: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        resultUrl: {type: string, nullable: true}
        error: {allOf: [{$ref: '#/components/schemas/Error'}], nullable: true}
    Evidence:
      type: object
      required: [evidenceId, evidenceType, workId, sourceDataset, sourceRecordId, snapshot, sourceUri, text, textS3Uri, graphPath, chunkId, score, provenance, supportingContent]
      properties:
        evidenceId: {type: string}
        evidenceType: {type: string}
        workId: {type: string, nullable: true}
        sourceDataset: {type: string}
        sourceRecordId: {type: string}
        snapshot: {type: string}
        sourceUri: {type: string}
        text: {type: string, nullable: true}
        textS3Uri: {type: string, nullable: true}
        graphPath: {type: array, nullable: true, items: {type: string}}
        chunkId: {type: string, nullable: true}
        score: {type: number}
        provenance: {type: object}
        supportingContent: {type: object, nullable: true}
    Explain:
      type: object
      required: [queryId, traceId, queryPlan, stagesExecuted, stageFailures, promptVersions, modelVersions, evidenceIds, scoreComponents, counters, verificationStatus, verification, outcome, reason, metricVersions, graphRunIds]
      properties:
        queryId: {type: string}
        traceId: {type: string}
        queryPlan: {type: object, nullable: true, description: Includes actual planned retrieval mode and filters}
        stagesExecuted: {type: array, nullable: true, items: {type: string}, description: Only observed persisted service stages; null when no application session exists}
        stageFailures: {type: array, items: {type: object}}
        promptVersions: {type: array, items: {type: string}}
        modelVersions: {type: array, items: {type: object}}
        evidenceIds: {type: array, items: {type: string}}
        scoreComponents: {type: array, items: {type: object}, description: Actual persisted evidence scores; absent weights are not invented}
        counters: {type: object, description: Actual latency and claim counts; unknown cache hits and retry counts are null}
        verificationStatus: {type: string}
        verification: {type: array, items: {type: object}}
        outcome: {type: string}
        reason: {type: string, nullable: true}
        metricVersions: {type: array, items: {type: string}}
        graphRunIds: {type: array, items: {type: string}}
    GraphPage:
      type: object
      required: [nodeId, snapshot, direction, depth, items, cursor]
      properties:
        nodeId: {type: string}
        snapshot: {type: string}
        direction: {type: string, enum: [in, out, both]}
        depth: {type: integer}
        items: {type: array, items: {type: object, required: [nodeId, edgeId, edgeType, depth, fromId, toId, provenance]}}
        cursor: {type: string, nullable: true}
    SemanticRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: {type: string, minLength: 1, maxLength: 8192}
        topK: {type: integer, minimum: 1, maximum: 50, default: 50}
        filters: {type: object, additionalProperties: {type: string}}
    PublicSemanticRequest:
      type: object
      additionalProperties: false
      required: [question]
      description: Public limits; the question and filter values count Unicode code points
      properties:
        question: {type: string, minLength: 1, maxLength: 1000, description: Must contain a non-whitespace character}
        topK: {type: integer, minimum: 1, maximum: 20, default: 20}
        filters:
          type: object
          maxProperties: 16
          description: Same shape as the internal route; keys non-empty
          additionalProperties: {type: string, maxLength: 1000}
    PublicSemanticResponse:
      type: object
      additionalProperties: false
      required: [hits, model]
      properties:
        hits:
          type: array
          description: >-
            At most the forwarded topK hits, as returned by the vector store; if the downstream
            returns more, query-api keeps the first topK in downstream order
          items:
            type: object
            additionalProperties: false
            required: [key, distance, metadata]
            properties:
              key: {type: string}
              distance: {type: number}
              metadata: {type: object, additionalProperties: {type: string}}
        model:
          type: object
          additionalProperties: false
          required: [modelId, version, dimension]
          properties:
            modelId: {type: string}
            version: {type: string}
            dimension: {type: integer}
    SemanticResponse:
      type: object
      required: [hits]
      properties:
        hits: {type: array, items: {type: object, required: [key, distance, metadata]}}
        model: {type: object}
