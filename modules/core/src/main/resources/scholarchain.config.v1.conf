{
  "configSchemaVersion": "scholarchain.config.v1",
  "application": {
    "environment": "local-dev",
    "region": "local-dev-region",
    "awsAccountId": null
  },
  "storage": {
    "rawBucket": "local-dev-raw",
    "curatedBucket": "local-dev-curated",
    "graphBucket": "local-dev-graph",
    "ragBucket": "local-dev-rag"
  },
  "neptune": {
    "endpoint": "local-dev-neptune.example",
    "port": 8182,
    "queryTimeoutMs": 30000
  },
  "s3Vectors": {
    "vectorBucket": "local-dev-vectors",
    "indexes": {
      "researchers": "local-dev-researchers",
      "communities": "local-dev-communities",
      "abstracts": "local-dev-abstracts",
      "paths": "local-dev-paths",
      "topicInstitutions": "local-dev-topic-institutions"
    }
  },
  "entityResolution": {
    "policyVersion": "local-dev-er-policy",
    "acceptThreshold": 0.5,
    "rejectThreshold": 0.25,
    "llmBandMin": 0.3,
    "llmBandMax": 0.4
  },
  "graph": {
    "windowStartYear": 2011,
    "windowEndYear": 2011,
    "bridgeAlgorithm": "local-dev-bridge",
    "bridgeParameters": {
      "note": "local-dev placeholder"
    }
  },
  "retrieval": {
    "graphLimit": 25,
    "vectorLimit": 10,
    "contextTokenBudget": 4096,
    "fusionPolicyVersion": "local-dev-fusion",
    "maxPathDepth": 4
  },
  "models": {
    "embeddingModel": "local-dev-embedding",
    "synthesisModel": "local-dev-synthesis",
    "verificationModel": "local-dev-verification"
  },
  "operations": {
    "synchronousDeadlineMs": 30000,
    "maxWorkflowRetries": 2,
    "maxConcurrentLlmCalls": 4
  }
}
